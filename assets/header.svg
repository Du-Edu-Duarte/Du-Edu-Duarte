<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Eduardo Costa Duarte, Analista de Sistemas. Sistemas sob medida, automação e dashboards.">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DA8C"/>
      <stop offset="0.5" stop-color="#E2B454"/>
      <stop offset="1" stop-color="#B8842A"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2B454" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F6DA8C"/>
      <stop offset="1" stop-color="#E2B454" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#3a2c10" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0c0b09" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E2B454" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .f{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .name{font-size:66px;font-weight:800;letter-spacing:-1px;fill:url(#gold)}
    .tag{font-size:17px;letter-spacing:6px;fill:#E2B454;fill-opacity:.85}
    .role{font-size:27px;fill:#f3ead6;opacity:0;animation:cycle 12s infinite}
    .r2{animation-delay:4s}.r3{animation-delay:8s}
    .foot{font-size:15px;fill:#a89a78;letter-spacing:1px}
    .line{animation:slide 5s linear infinite}
    .dot{animation:pulse 2.4s ease-in-out infinite}
    .rise{animation:rise 1.1s ease-out both}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes slide{from{transform:translateX(-520px)}to{transform:translateX(1200px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.line,.dot,.rise{animation:none}.role{animation:none}.r1{opacity:1}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#0c0b09"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect class="line" x="0" y="0" width="520" height="3" fill="url(#sweep)"/>
    <rect class="line" x="0" y="337" width="520" height="3" fill="url(#sweep)" style="animation-delay:-2.5s"/>

    <g class="rise">
      <circle class="dot" cx="418" cy="72" r="4" fill="#E2B454"/>
      <text class="f tag" x="600" y="78" text-anchor="middle">ECD TECNOLOGIA</text>
      <circle class="dot" cx="782" cy="72" r="4" fill="#E2B454" style="animation-delay:-1.2s"/>
    </g>
    <text class="f name rise" x="600" y="160" text-anchor="middle" style="animation-delay:.15s">Eduardo Costa Duarte</text>
    <rect x="540" y="186" width="120" height="3" rx="1.5" fill="url(#gold)"/>

    <text class="m role r1" x="600" y="240" text-anchor="middle">&gt; sistemas sob medida</text>
    <text class="m role r2" x="600" y="240" text-anchor="middle">&gt; automação de processos</text>
    <text class="m role r3" x="600" y="240" text-anchor="middle">&gt; dashboards que mostram o que importa</text>

    <text class="f foot" x="600" y="298" text-anchor="middle">Analista de Sistemas  ·  Processos  ·  São Paulo, Brasil</text>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#E2B454" stroke-opacity="0.35" stroke-width="2"/>
</svg>
