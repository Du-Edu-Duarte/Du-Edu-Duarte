name: Cobrinha de contribuições

# Gera a animação da cobrinha comendo o gráfico de contribuições
# e publica os SVGs no branch "output".
on:
  schedule:
    - cron: "43 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cobrinha.yml"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#B8842A
            dist/snake-dark.svg?palette=github-dark&color_snake=#E2B454&color_dots=#161b22,#4a3a17,#7a5f24,#b8842a,#e2b454
      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
